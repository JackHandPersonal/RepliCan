[/Script/UnrealEd.ProjectPackagingSettings]
; THE GAME'S AUTHORED DATA IS NOT .uasset, AND IT HAS TO BE STAGED EXPLICITLY.
;
; Content/GameData/ holds the weapon and item catalogues, the character sheet spec, terminal text,
; conversations, sequences, character configs and the loose runtime WAVs -- plain files the game
; reads at runtime through JsonData::DataDir(). Cooking stages .uasset packages; it does not stage
; loose files, so without the line below a packaged build comes up with every catalogue empty -- no
; weapons, no items, no sheet, no dialogue -- while the editor keeps working perfectly.
;
; IT MUST LIVE UNDER Content/. Paths here resolve relative to the project's CONTENT directory, not
; the project root. These six folders sat at the project root until 2026-09-19 and could not be
; staged at all: UAT logged "Unable to find directory <Project>\Content\UI for staging", THE COOK
; SUCCEEDED ANYWAY, and the staged manifest contained none of them. A green package is not evidence
; that the data shipped -- check Saved/StagedBuilds/Windows/Manifest_UFSFiles_Win64.txt for a file
; you know should be there, e.g. Weapons.json.
+DirectoriesToAlwaysStageAsUFS=(Path="GameData")

; The Landmass plugin's landscape-brush materials reference editor-only engine assets
; (/Engine/EditorMaterials/TilingAA*, /Engine/EditorResources/S_Terrain), which are never cookable,
; so the cook fails with 8 "Content is missing from cook" errors before it stages anything. This
; project uses no landscape and no water: zero references in Source/ or Content/RepliCan/. Disabling
; the plugin in RepliCan.uproject alone did not keep its content out of the cook, so it is excluded
; explicitly here as well.
+DirectoriesToNeverCook=(Path="/Landmass")

; COOK THE GAME, NOT JUST THE TITLE SCREEN.
;
; The cooker walks references outward from GameDefaultMap (Lvl_Title). Nothing in the title screen
; references the facility, so a package built without this contained ONE map and none of the game:
; verified 2026-09-19 by listing the container -- 1 map entry, 0 entries under Optics, while all 294
; GameData files were present. The build succeeded and the data shipped; the game did not.
+MapsToCook=(FilePath="/Game/RepliCan/Maps/Lvl_Title")
+MapsToCook=(FilePath="/Game/RepliCan/Maps/Lvl_AsteroidFacility")

; ASSETS NAMED ONLY BY A RUNTIME STRING ARE INVISIBLE TO THE COOKER.
;
; ~191 distinct "/Game/..." literals in C++ plus every mesh, icon and material named in the JSON
; catalogues are resolved with LoadObject at runtime. The cooker cannot see a string, so none of them
; is reachable from a map reference and none would be cooked -- the optic meshes are the case that
; caught this. Cooking the project's own content wholesale is the honest fix while that many paths
; are dynamic; it costs package size, not correctness.
+DirectoriesToAlwaysCook=(Path="/Game/RepliCan")
