[/Script/NavigationSystem.RecastNavMesh]
; DYNAMIC, not Static. Static navmesh is built offline by Build > Build Paths and never rebuilds
; itself -- which is wrong for this project twice over: Tools/facility_layout.py regenerates the
; deck's geometry on every run, so a navmesh built by hand goes stale the moment anyone lays a new
; crate; and built nav data has to be cooked into a package, which is the same class of problem as
; the six loose data directories. Dynamic builds on load, in the editor and in a shipped build, at a
; cost that is negligible for one basement-sized volume. Measured 2026-09-19: with Static, a path
; query across the bot's own patrol box returned zero points.
RuntimeGeneration=Dynamic
